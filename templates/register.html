{% extends "base.html" %}
{% block title %}Register - Python Games{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <h1>Create Account</h1>
            <p>Join and start playing games</p>
        </div>

        <form method="POST" class="auth-form" id="register-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username"
                       required minlength="3" autocomplete="username" autofocus>
                <span class="form-hint">At least 3 characters</span>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="your@email.com"
                       required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="Create a password"
                           required minlength="6" autocomplete="new-password">
                    <button type="button" class="password-toggle" onclick="togglePassword('password', this)">👁️</button>
                </div>
                <span class="form-hint">At least 6 characters</span>
                <div class="password-strength" id="strength-bar">
                    <div class="strength-fill" id="strength-fill"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <div class="password-wrapper">
                    <input type="password" id="confirm_password" name="confirm_password"
                           placeholder="Confirm your password" required autocomplete="new-password">
                    <button type="button" class="password-toggle" onclick="togglePassword('confirm_password', this)">👁️</button>
                </div>
                <span class="form-hint password-match" id="match-hint"></span>
            </div>

            <button type="submit" class="btn btn-primary btn-full">Create Account</button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="/login">Log in</a></p>
        </div>
    </div>
</div>

<script>
function togglePassword(inputId, btn) {
    const input = document.getElementById(inputId);
    if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
    } else {
        input.type = 'password';
        btn.textContent = '👁️';
    }
}

document.getElementById('password').addEventListener('input', function() {
    const val = this.value;
    const fill = document.getElementById('strength-fill');
    let strength = 0;
    if (val.length >= 6) strength++;
    if (val.length >= 10) strength++;
    if (/[A-Z]/.test(val)) strength++;
    if (/[0-9]/.test(val)) strength++;
    if (/[^A-Za-z0-9]/.test(val)) strength++;

    const percent = (strength / 5) * 100;
    fill.style.width = percent + '%';
    fill.className = 'strength-fill';
    if (strength <= 1) fill.classList.add('weak');
    else if (strength <= 3) fill.classList.add('medium');
    else fill.classList.add('strong');

    checkMatch();
});

document.getElementById('confirm_password').addEventListener('input', checkMatch);

function checkMatch() {
    const pw = document.getElementById('password').value;
    const cpw = document.getElementById('confirm_password').value;
    const hint = document.getElementById('match-hint');

    if (!cpw) {
        hint.textContent = '';
    } else if (pw === cpw) {
        hint.textContent = '✓ Passwords match';
        hint.style.color = '#2ecc71';
    } else {
        hint.textContent = '✗ Passwords do not match';
        hint.style.color = '#e74c3c';
    }
}
</script>
{% endblock %}
