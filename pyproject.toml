[tool.poetry]
name = "python-games-platform"
version = "1.0.0"
description = "Enterprise Python Game Suite with AI, Engine, Simulation, API, and CLI"
authors = ["Developer dev@example.com"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
Flask = "^3.1.3"
Werkzeug = "^3.1.8"
pytest = "^7.4.0"
pytest-cov = "^4.1.0"

[tool.poetry.group.dev.dependencies]
black = "^23.7.0"
flake8 = "^6.1.0"
mypy = "^1.5.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
